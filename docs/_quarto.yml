project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "notebooks/*.ipynb"
    - "!notebooks/caveclient_setup_colab.ipynb"
website:
  title: "Teaching Connectomics"
  favicon: resources/ai_logos/AI_lens_blue.svg
  navbar:
    logo: resources/ai_logos/AI_lens_blue.svg
    logo-alt: "Allen Institute"
    left:
      - about.qmd
      - href: index.qmd
        text: Education Modules
      - code-tutorials.qmd
    tools: 
      - icon: github
        menu:
          - text: Report Issue
            href: https://github.com/AllenInstitute/Teaching_Connectomics/issues/new
            target: _blank
          - text: Join Discussion
            href: https://github.com/AllenInstitute/Teaching_Connectomics/discussions
            target: _blank
          - text: Tutorial Code
            href: https://github.com/AllenInstitute/Teaching_Connectomics/tree/main/docs/notebooks
            target: _blank
  back-to-top-navigation: true
  
filters:
  - _filters/task.lua
  - quarto
  - _filters/gridtables.lua

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    link-external-newwindow: true
  pdf:
    pdf-engine: lualatex
    documentclass: report
    geometry: margin=1in
    fontsize: 11pt
    toc: false
    number-sections: false
    mainfont: "SourceSans3-Regular.otf"
    mainfontoptions:
      - "Path=fonts/"
      - "ItalicFont=SourceSans3-It.otf"
      - "BoldFont=SourceSans3-Bold.otf"
      - "BoldItalicFont=SourceSans3-BoldIt.otf"
    include-in-header: "tex/preamble.tex"
    template-partials:
      - "tex/before-body.tex"